name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (format, vet, unit + flow/contract tests, fuzz)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: calendar
          POSTGRES_PASSWORD: calendar
          POSTGRES_DB: calendar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U calendar -d calendar_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: Tests (the flow test validates every response against api/openapi.yaml)
        run: go test -count=1 ./...
        env:
          TEST_DATABASE_URL: postgres://calendar:calendar@localhost:5432/calendar_test?sslmode=disable
      - name: Fuzz the BS date parser
        run: go test -run XXX -fuzz FuzzParseAndConvertBS -fuzztime 30s ./services/calendar-api/internal/bscal/
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  api-contract:
    name: OpenAPI lint and breaking-change check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lint (redocly.yaml)
        run: npx --yes @redocly/cli@latest lint api/openapi.yaml
      - name: Breaking changes against the target branch
        if: github.event_name == 'pull_request'
        run: |
          if ! git show "origin/${{ github.base_ref }}:api/openapi.yaml" > /tmp/base-openapi.yaml 2>/dev/null; then
            echo "No base spec on ${{ github.base_ref }}; skipping."; exit 0
          fi
          docker run --rm -v /tmp:/base -v "$PWD/api:/head" tufin/oasdiff \
            breaking /base/base-openapi.yaml /head/openapi.yaml --fail-on ERR

  stack:
    name: Docker image + compose smoke test
    runs-on: ubuntu-latest
    needs: [go]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up -d --build
      - name: Smoke test (follows docs/api.md)
        run: docker compose --profile tools run --rm smoke
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v
