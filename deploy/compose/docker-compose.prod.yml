# Production stack for ONE Linux server (docs/deployment.md).
#
#   cd deploy/compose
#   cp .env.production.example .env.production        # fill in every REQUIRED value
#   export VERSION=v1.0.0                             # image tag built by .github/workflows/release.yml
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# Managed Postgres is recommended (point DATABASE_URL at it). To run Postgres on the same VM
# instead, add:  --profile bundled-db   (starts postgres + a daily pg_dump backup job).
#
# Upgrades: set the new VERSION and run the same `up -d`. The bootstrap job migrates first; Caddy
# holds requests for up to 10 s while the api containers restart, so clients see no errors.

name: bs-calendar

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

x-app: &app
  image: ${IMAGE:-ghcr.io/your-org/calendar-api}:${VERSION:?set VERSION to an image tag, for example v1.0.0}
  env_file: [.env.production]
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging: *logging

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN, for example calendar-api.example.org}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }
    logging: *logging

  # One-shot: migrations (as the owner role) + idempotent seed. Runs before every api rollout.
  bootstrap:
    <<: *app
    command: ["bootstrap"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy, required: false }

  api:
    <<: *app
    command: ["serve"]
    deploy:
      replicas: ${API_REPLICAS:-2}
      resources:
        limits: { cpus: "1.0", memory: 256M }
    stop_grace_period: 40s
    depends_on:
      bootstrap: { condition: service_completed_successfully }

  worker:
    <<: *app
    command: ["worker"]
    environment:
      METRICS_ADDR: ":9091"
    healthcheck:
      disable: true
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }
    stop_grace_period: 20s
    depends_on:
      bootstrap: { condition: service_completed_successfully }

  # ---- optional: Postgres on the same VM (profile bundled-db) ----------------------------
  postgres:
    profiles: [bundled-db]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-calendar_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}   # required by the postgres image when bundled-db is used
      POSTGRES_DB: ${POSTGRES_DB:-calendar}
      CALENDAR_OWNER_PASSWORD: ${CALENDAR_OWNER_PASSWORD:-}
      CALENDAR_APP_PASSWORD: ${CALENDAR_APP_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # First start only: create calendar_owner and calendar_app (deploy/postgres/roles.sql).
      - ../postgres/roles.sql:/docker-entrypoint-initdb.d/roles.sql.in:ro
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging: *logging

  backup:
    profiles: [bundled-db]
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-calendar_admin}
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
      PGDATABASE: ${POSTGRES_DB:-calendar}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres: { condition: service_healthy }
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
  pgdata:
