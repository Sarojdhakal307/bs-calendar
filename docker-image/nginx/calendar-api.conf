# /etc/nginx/sites-available/calendar-api.conf
# Sends calendar.oneclickinfosys.com to the "web" container, which serves:
#   /  website    /api  API    /admin  dashboard    /docs  API reference
# HTTPS is added by: sudo certbot --nginx -d calendar.oneclickinfosys.com

server {
    listen 80;
    server_name calendar.oneclickinfosys.com;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
