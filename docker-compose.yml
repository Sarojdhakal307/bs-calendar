# Local stack for the BS/AD calendar API.
#
#   docker compose up -d --build        # postgres + bootstrap + api + worker
#   open http://localhost:8080/docs     # API reference (Redoc); /docs/try for Swagger UI
#   docker compose --profile test run --rm test               # Go tests against a real Postgres
#   docker compose --profile tools up -d webhook-sink          # then: docker compose logs -f webhook-sink
#
# Values come from .env (see .env.example). The defaults below are for development only.

name: bs-calendar

x-api-env: &api-env
  DATABASE_URL: postgres://${POSTGRES_USER:-calendar}:${POSTGRES_PASSWORD:-calendar}@postgres:5432/${POSTGRES_DB:-calendar}?sslmode=disable
  HTTP_ADDR: ":8080"
  METRICS_ADDR: ":9090"
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
  TRUST_PROXY: ${TRUST_PROXY:-false}
  MIN_SUPPORTED_CLIENT: ${MIN_SUPPORTED_CLIENT:-0.0.0}
  JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-dev-only-jwt-signing-key-change-me-0123456789abcdef}
  JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
  JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-720h}
  WEBHOOK_SECRET_KEY: ${WEBHOOK_SECRET_KEY:-dev-only-webhook-encryption-key-change-me-0123456789}
  DEFAULT_TENANT_SLUG: ${DEFAULT_TENANT_SLUG:-default}
  BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-change-me-please-now}
  BOOTSTRAP_PUBLIC_KEY: ${BOOTSTRAP_PUBLIC_KEY:-pk_dev_local_public_key_0001}
  BOOTSTRAP_SERVER_KEY: ${BOOTSTRAP_SERVER_KEY:-sk_dev_local_server_key_0001}
  REQUIRE_API_KEY: ${REQUIRE_API_KEY:-true}
  ALLOW_PRIVATE_WEBHOOKS: ${ALLOW_PRIVATE_WEBHOOKS:-true}
  CDN_PURGE_URL: ${CDN_PURGE_URL:-}
  CDN_PURGE_TOKEN: ${CDN_PURGE_TOKEN:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: ${LOG_FORMAT:-json}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-calendar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-calendar}
      POSTGRES_DB: ${POSTGRES_DB:-calendar}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot: migrations + seed data. Idempotent, so it runs on every `up`.
  bootstrap:
    build:
      context: .
      dockerfile: services/calendar-api/Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    image: bs-calendar/calendar-api:${VERSION:-dev}
    command: ["bootstrap"]
    environment: *api-env
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: bs-calendar/calendar-api:${VERSION:-dev}
    command: ["serve"]
    environment: *api-env
    ports:
      - "${HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${METRICS_PORT:-9090}:9090"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    image: bs-calendar/calendar-api:${VERSION:-dev}
    command: ["worker"]
    environment:
      <<: *api-env
      METRICS_ADDR: ":9091"
    healthcheck:
      disable: true
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

  # Echoes every webhook delivery to its logs (development only).
  # Register http://webhook-sink:8080/hook as a webhook URL to see deliveries.
  webhook-sink:
    profiles: ["tools"]
    image: mendhak/http-https-echo:35
    environment:
      HTTP_PORT: "8080"
    ports:
      - "127.0.0.1:8081:8080"

  # Follows docs/api.md against the running stack (docker compose --profile tools run --rm smoke).
  smoke:
    profiles: ["tools"]
    image: alpine:3.20
    command: ["sh", "-c", "apk add --no-cache curl jq >/dev/null && sh /scripts/smoke.sh"]
    environment:
      API: http://api:8080
      KEY: ${BOOTSTRAP_PUBLIC_KEY:-pk_dev_local_public_key_0001}
      ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-change-me-please-now}
    volumes:
      - ./scripts:/scripts:ro
    depends_on:
      - api

  # Go tests against a real Postgres (the separate calendar_test database).
  test:
    profiles: ["test"]
    image: golang:1.26-alpine
    working_dir: /src
    command: ["go", "test", "-count=1", "./..."]
    environment:
      TEST_DATABASE_URL: postgres://${POSTGRES_USER:-calendar}:${POSTGRES_PASSWORD:-calendar}@postgres:5432/calendar_test?sslmode=disable
      GOFLAGS: -buildvcs=false
    volumes:
      - .:/src
      - gomod:/go/pkg/mod
      - gocache:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  gomod:
  gocache:
