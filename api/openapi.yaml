            application/json:
              schema: { $ref: '#/components/schemas/CopyYearReport' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/admin/events/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Admin events]
      summary: Get an event
      operationId: getEvent
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Event. `ETag` is the value to send as `If-Match`.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Admin events]
      summary: Update an event (JSON Merge Patch, If-Match required)
      operationId: patchEvent
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/EventPatch' }
          application/json:
            schema: { $ref: '#/components/schemas/EventPatch' }
      responses:
        '200':
          description: Updated.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Admin events]
      summary: Soft-delete an event (If-Match required)
      description: Returns the deleted event. Restore it with `POST /restore`.
