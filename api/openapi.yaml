              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ApiClient' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Admin platform]
      summary: Issue an API key (shown once)
      operationId: createApiClient
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiClientInput' }
      responses:
        '201':
          description: Client and its key. Store the key now; it cannot be shown again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiClientCreated' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/admin/api-clients/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [Admin platform]
      summary: Revoke an API key
      operationId: revokeApiClient
      security: [{ BearerAuth: [] }]
      responses:
        '204': { description: Revoked. Other replicas stop accepting it within a minute. }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/admin/webhooks:
    get:
      tags: [Admin platform]
      summary: List webhooks
      operationId: listWebhooks
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Webhooks.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Webhook' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Admin platform]
      summary: Register a webhook (signing secret shown once)
      description: |
        Deliveries are `POST` JSON bodies (see `WebhookEvent`) with headers `X-Calendar-Event`,
        `X-Calendar-Delivery` and `X-Calendar-Signature: t=<unix>,v1=<hex HMAC-SHA256(secret, "<t>.<body>")>`.
        Reject signatures older than 5 minutes. Failed deliveries retry with backoff for about 24 hours.
      operationId: createWebhook
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookInput' }
      callbacks:
        delivery:
          '{$request.body#/url}':
            post:
              summary: Change notification sent to your webhook URL
              description: |
                Verify `X-Calendar-Signature` before trusting the body (see docs/api.md "Webhooks").
                Respond with any 2xx within 10 seconds; anything else is retried with backoff for about 24 hours.
              security: []
              parameters:
                - name: X-Calendar-Event
                  in: header
                  required: true
                  schema: { type: string, example: events.changed }
                - name: X-Calendar-Delivery
                  in: header
                  required: true
                  description: Delivery id; the same id is reused on retries, so use it to de-duplicate.
                  schema: { type: string }
                - name: X-Calendar-Signature
                  in: header
                  required: true
                  schema: { type: string, example: 't=1790000000,v1=5f2c9e…' }
              requestBody:
                required: true
                content:
                  application/json:
                    schema: { $ref: '#/components/schemas/WebhookEvent' }
              responses:
                '200': { description: Received. }
                '400': { description: Rejected (for example a bad signature); the delivery will be retried. }
      responses:
        '201':
          description: Webhook and its signing secret.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookCreated' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/admin/webhooks/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [Admin platform]
      summary: Deactivate a webhook
      operationId: deleteWebhook
      security: [{ BearerAuth: [] }]
      responses:
        '204': { description: Deactivated. }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/admin/webhooks/{id}/deliveries:
