  # ---------------------------------------------------------------- Admin year table
  /v1/admin/years:
    get:
      tags: [Admin year table]
      summary: The current year table with status and sources
      operationId: listYears
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Years.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/YearList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/admin/years/drafts:
    get:
      tags: [Admin year table]
      summary: List drafts (newest first)
      operationId: listYearDrafts
      security: [{ BearerAuth: [] }]
      parameters:
        - name: state
          in: query
          schema: { type: string, enum: [pending, approved, rejected] }
      responses:
        '200':
          description: Drafts.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/YearDraft' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Admin year table]
      summary: Propose a change to month lengths
      description: |
        Validates the whole resulting table (month lengths 29-32, contiguous years, start-date chain, plausible
        new-year dates) and returns an impact report listing events whose AD dates would move. Changing a year's
        total length also moves the next year's start, so fix both years in one draft. Requires `years:propose`.
      operationId: createYearDraft
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/YearDraftInput' }
            example:
              changes:
                - bsYear: 2084
                  days: [31, 31, 32, 31, 31, 30, 30, 30, 29, 30, 30, 30]
                  status: verified
                  source: Official calendar 2084, page 3
              note: Confirm 2084 against the official calendar
      responses:
        '201':
          description: Pending draft with warnings and impact.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/YearDraft' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/admin/years/drafts/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Admin year table]
      summary: Get a draft
      operationId: getYearDraft
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Draft.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/YearDraft' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/admin/years/drafts/{id}/approve:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Admin year table]
      summary: Approve and publish a draft (four-eyes)
      description: |
        The approver must not be the author (`403 FOUR_EYES_REQUIRED`). Approval re-validates against the
        current table, refuses if any event would fall on a date that no longer exists (`409` with
        `invalidEvents`), publishes a new data version, re-materialises events, notifies every replica
        and enqueues `data.published` webhooks.
      operationId: approveYearDraft
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Approved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/YearDraft' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/admin/years/drafts/{id}/reject:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Admin year table]
      summary: Reject (or withdraw) a pending draft
      operationId: rejectYearDraft
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonInput' }
      responses:
        '200':
          description: Rejected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/YearDraft' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Problem' }

