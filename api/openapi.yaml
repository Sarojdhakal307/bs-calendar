          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/admin/audit:
    get:
      tags: [Admin platform]
      summary: Audit trail (newest first)
      operationId: listAudit
      security: [{ BearerAuth: [] }]
      parameters:
        - name: entity
          in: query
          schema: { type: string, example: event }
        - name: entityId
          in: query
          schema: { type: string }
        - name: actorId
          in: query
          schema: { type: string, format: uuid }
        - name: action
          in: query
          schema: { type: string, example: event.publish }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Entries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/admin/health/data:
    get:
      tags: [Admin platform]
      summary: Data health for the dashboard and yearly-operations alerts
      operationId: getDataHealth
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Health.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataHealth' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Problem' }

security:
  - ApiKey: []

components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Public (`pk_…`) or server (`sk_…`) API key. Local dev key `pk_dev_local_public_key_0001`.
    ApiKeyQuery:
      type: apiKey
      in: query
      name: api_key
      description: Accepted only on `/v1/events.ics`.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  headers:
    ETag:
      description: Entity tag. Send it back in `If-None-Match` (GET) or `If-Match` (admin writes).
      schema: { type: string }
    CacheControl:
      description: Caching policy (immutable resources are cached for a year).
      schema: { type: string }

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    App:
      name: app
      in: path
      required: true
      description: App key, for example `web` or `mobile`.
      schema: { type: string, pattern: '^[a-z][a-z0-9-]{1,30}$' }
    ConfigVersion:
      name: version
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from `nextCursor`.
      schema: { type: string }
    IfMatch:
      name: If-Match
      in: header
      description: Optional optimistic-lock version, for example `"v3"`.
      schema: { type: string, example: '"v3"' }
    IfMatchRequired:
      name: If-Match
      in: header
      required: true
      description: Current version from `ETag`/`version`, for example `"v3"`. Missing → `428`; stale → `412`.
      schema: { type: string, example: '"v3"' }

  responses:
    NotModified:
      description: Not modified (your `If-None-Match` matched).
    Problem:
      description: Error (RFC 9457 problem document).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    BadRequest:
      description: Malformed request (`BAD_REQUEST`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing or invalid credentials (`UNAUTHORIZED`, `INVALID_API_KEY`, `INVALID_CREDENTIALS`, `TOKEN_REUSED`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Not allowed (`FORBIDDEN`, `ORIGIN_NOT_ALLOWED`, `FOUR_EYES_REQUIRED`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Not found (`NOT_FOUND`, `VERSION_NOT_FOUND`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Conflict (`CONFLICT`, `INVALID_STATE`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionFailed:
      description: Stale `If-Match` (`VERSION_CONFLICT`); the body has `currentVersion`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionRequired:
      description: '`If-Match` is required (`PRECONDITION_REQUIRED`).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: Validation failed (`VALIDATION_FAILED`, `INVALID_DATE`, `OUT_OF_RANGE`); see `errors`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnsupportedMediaType:
      description: Wrong `Content-Type` (`UNSUPPORTED_MEDIA_TYPE`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Rate limited (`RATE_LIMITED`); honour `Retry-After`.
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    # ------------------------------------------------------------ shared
    Problem:
      type: object
      description: |
        RFC 9457 problem document. `code` is stable and documented in docs/api.md. Some errors add
        extension members: `currentVersion` (412), `invalidEvents` (409 on year approval), `issues`
        (invalid year table), `report` (UI config or import validation), `constraint`, `events`.
      required: [type, title, status, code, instance]
      properties:
        type: { type: string, example: 'urn:bs-calendar:problem:VALIDATION_FAILED' }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          enum: [BAD_REQUEST, VALIDATION_FAILED, INVALID_DATE, OUT_OF_RANGE, NOT_FOUND, VERSION_NOT_FOUND,
                 UNAUTHORIZED, INVALID_CREDENTIALS, INVALID_API_KEY, TOKEN_REUSED, FORBIDDEN, ORIGIN_NOT_ALLOWED,
                 FOUR_EYES_REQUIRED, CONFLICT, INVALID_STATE, VERSION_CONFLICT, PRECONDITION_REQUIRED,
                 PAYLOAD_TOO_LARGE, UNSUPPORTED_MEDIA_TYPE, RATE_LIMITED, INTERNAL, SERVICE_UNAVAILABLE]
        detail: { type: string }
        instance: { type: string }
        requestId: { type: string }
        errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field: { type: string, example: title.en }
        message: { type: string }
    Localized:
      type: object
      additionalProperties: false
      required: [en, ne]
      properties:
        en: { type: string }
        ne: { type: string }
    Text:
      type: object
      additionalProperties: false
      description: Bilingual text; English required, Nepali optional.
      required: [en]
      properties:
        en: { type: string, maxLength: 5000 }
        ne: { type: string, maxLength: 5000 }
    Colors:
      type: object
      additionalProperties: false
      required: [light, dark]
      properties:
        light: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        dark: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
    BSDate:
      type: string
      pattern: '^\d{4}-\d{2}-\d{2}$'
      description: BS date (months can have 32 days, so this is not an RFC 3339 date).
      example: '2083-06-08'
    YearStatus:
      type: string
      enum: [verified, projected]
      description: '`projected` years are estimates that may change when the official calendar is published.'
    Health:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string }
    Ready:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status: { type: string, enum: [ready, not ready] }
        checks:
          type: object
          additionalProperties: { type: string }

    # ------------------------------------------------------------ sync
    Manifest:
      type: object
      additionalProperties: false
      required: [dataVersion, dataSha256, supportedRange, currentBsYear, firstProjectedBsYear, config, eventBuckets,
                 defaultBucketVersion, minSupportedClient, updateRequired, links, serverTime]
      properties:
        dataVersion: { type: integer, format: int64, example: 12 }
        dataSha256: { type: string, description: "SHA-256 of the year table (invariant I8); see CalendarData.sha256 for the exact canonical form." }
        supportedRange: { $ref: '#/components/schemas/SupportedRange' }
        currentBsYear: { type: integer, description: Current BS year in Nepal. }
        firstProjectedBsYear: { type: integer, nullable: true }
        config: { $ref: '#/components/schemas/ManifestConfig' }
        eventBuckets:
          type: object
          description: Versions for BS years that have their own counter.
          additionalProperties: { type: integer, format: int64 }
          example: { '2082': 41, '2083': 57 }
        defaultBucketVersion: { type: integer, format: int64, description: Version of every bucket not listed in `eventBuckets`. }
        minSupportedClient: { type: string }
        updateRequired: { type: boolean, description: True when `clientVersion` is below `minSupportedClient`. }
        links:
          type: object
          additionalProperties: false
          required: [data, config, bucketTemplate]
          properties:
            data: { type: string, example: /v1/calendar/data/12 }
            config: { type: string, example: /v1/ui-config/mobile/7 }
            bucketTemplate: { type: string, example: '/v1/events/buckets/{bsYear}/{version}' }
        serverTime: { type: string, format: date-time, description: Use it to detect a wrong device clock. }
    SupportedRange:
      type: object
      additionalProperties: false
      required: [minBsYear, maxBsYear, minAd, maxAd]
      properties:
        minBsYear: { type: integer }
        maxBsYear: { type: integer }
        minAd: { type: string, format: date }
        maxAd: { type: string, format: date }
    ManifestConfig:
      type: object
      additionalProperties: false
      required: [app, version, minClientVersion, candidate]
      properties:
        app: { type: string }
        version: { type: integer, description: Stable version; 0 means the built-in default. }
        minClientVersion: { type: string }
        candidate:
          nullable: true
          type: object
          additionalProperties: false
          required: [version, percent]
          properties:
            version: { type: integer }
            percent: { type: integer, minimum: 0, maximum: 100 }
    CalendarData:
      type: object
      additionalProperties: false
      required: [version, sha256, minYear, maxYear, years]
      properties:
        version: { type: integer, format: int64 }
        sha256:
          type: string
          description: |
            Hex SHA-256 of the canonical text form: one line per year, in table order,
            `<y>:<start>:<d1>,<d2>,...,<d12>:<status>` followed by a newline (`\n`).
            It does not depend on JSON key order or whitespace. In JavaScript:
            `sha256(years.map(y => [y.y, y.start, y.days.join(","), y.status].join(":") + "\n").join(""))`.
        minYear: { type: integer }
        maxYear: { type: integer }
        years:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [y, start, days, status]
            properties:
              y: { type: integer, description: BS year. }
              start: { type: string, format: date, description: AD date of 1 Baisakh. }
              days:
                type: array
                minItems: 12
                maxItems: 12
                items: { type: integer, minimum: 29, maximum: 32 }
              status: { $ref: '#/components/schemas/YearStatus' }
    UiConfigDocument:
      type: object
      description: |
        Admin-controlled UI configuration. The authoritative schema is `fixtures/ui-config.schema.json`
        (JSON Schema 2020-12); clients parse each field independently and fall back to defaults.
      additionalProperties: true
      properties:
        schemaVersion: { type: integer, enum: [1] }
        defaults: { type: object, additionalProperties: true }
        display: { type: object, additionalProperties: true }
        theme:
          type: object
          additionalProperties: true
          properties:
            light: { type: object, additionalProperties: { type: string } }
            dark: { type: object, additionalProperties: { type: string } }
        shape: { type: object, additionalProperties: true }
        font: { type: object, additionalProperties: true }
      example:
        schemaVersion: 1
        defaults: { mode: BS, locale: ne, digits: devanagari, weekStart: 0, weekendDays: [6], todayTimeZone: device, colorScheme: system }
        display: { allowModeSwitch: true, showSecondaryDate: true, showEventDots: true, maxDotsPerDay: 3, highlightHolidays: true, showProjectedWarning: false, views: [month, agenda], monthHeaderFormat: MMMM YYYY }
        theme:
          light: { bg: '#FFFFFF', surface: '#F6F7F9', text: '#111827', muted: '#4B5563', border: '#E5E7EB', primary: '#1D4ED8', onPrimary: '#FFFFFF', today: '#1D4ED8', holiday: '#B91C1C', weekend: '#B91C1C', disabled: '#9CA3AF' }
          dark: { bg: '#0B0F17', surface: '#141A24', text: '#F3F4F6', muted: '#9CA3AF', border: '#273041', primary: '#60A5FA', onPrimary: '#0B0F17', today: '#60A5FA', holiday: '#F87171', weekend: '#F87171', disabled: '#4B5563' }
        shape: { radius: 12, density: comfortable }
        font: { family: system }
    DatePair:
      type: object
      additionalProperties: false
      required: [ad, bs]
      properties:
        ad: { type: string, format: date }
        bs:
          type: string
          nullable: true
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Null only outside the supported BS range.
    PublicCategory:
      type: object
      additionalProperties: false
      required: [key, name, color, isHoliday, sortOrder]
      properties:
        key: { type: string, example: public_holiday }
        name: { $ref: '#/components/schemas/Text' }
        color: { $ref: '#/components/schemas/Colors' }
        isHoliday: { type: boolean }
        sortOrder: { type: integer }
    Occurrence:
      type: object
      additionalProperties: false
      description: One occurrence of a published event. Recurring events have ids like `<eventId>@<adDate>`.
      required: [id, eventId, title, description, category, isHoliday, basis, start, end, allDay, startTime, endTime,
                 tz, recurring, color, version, updatedAt]
      properties:
        id: { type: string }
        eventId: { type: string, format: uuid }
        title: { $ref: '#/components/schemas/Text' }
        description:
          type: object
          nullable: true
          allOf: [{ $ref: '#/components/schemas/Text' }]
        category: { type: string }
        isHoliday: { type: boolean }
        basis: { type: string, enum: [AD, BS] }
        start: { $ref: '#/components/schemas/DatePair' }
        end: { $ref: '#/components/schemas/DatePair' }
        allDay: { type: boolean }
        startTime: { type: string, nullable: true, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        endTime: { type: string, nullable: true, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        tz: { type: string, example: Asia/Kathmandu }
        recurring: { type: boolean }
        color: { $ref: '#/components/schemas/Colors' }
        version: { type: integer }
        updatedAt: { type: string, format: date-time }
    EventBucket:
      type: object
      additionalProperties: false
      required: [bsYear, version, status, range, generatedAt, categories, events]
      properties:
        bsYear: { type: integer }
        version: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/YearStatus' }
        range:
          type: object
          additionalProperties: false
          required: [start, end]
          description: AD dates of 1 Baisakh and the last day of Chaitra.
          properties:
            start: { type: string, format: date }
            end: { type: string, format: date }
        generatedAt: { type: string, format: date-time }
        categories: { type: array, items: { $ref: '#/components/schemas/PublicCategory' } }
        events: { type: array, items: { $ref: '#/components/schemas/Occurrence' } }

    # ------------------------------------------------------------ dates
    Conversion:
      type: object
      additionalProperties: false
      required: [ad, bs, weekday, epochDay, dataVersion]
      properties:
        ad:
          type: object
          additionalProperties: false
          required: [date, year, month, day, monthName]
          properties:
            date: { type: string, format: date }
            year: { type: integer }
            month: { type: integer }
            day: { type: integer }
            monthName: { $ref: '#/components/schemas/Localized' }
        bs:
          type: object
          additionalProperties: false
          required: [date, dateNe, year, month, day, monthName, daysInMonth, yearStatus]
          properties:
            date: { $ref: '#/components/schemas/BSDate' }
            dateNe: { type: string, description: The BS date in Devanagari digits. }
            year: { type: integer }
            month: { type: integer }
            day: { type: integer }
            monthName: { $ref: '#/components/schemas/Localized' }
            daysInMonth: { type: integer }
            yearStatus: { $ref: '#/components/schemas/YearStatus' }
        weekday:
          type: object
          additionalProperties: false
          required: [index, name]
          properties:
            index: { type: integer, minimum: 0, maximum: 6, description: 0 = Sunday. }
            name: { $ref: '#/components/schemas/Localized' }
        epochDay: { type: integer, format: int64, description: Days since 1970-01-01. }
        dataVersion: { type: integer, format: int64 }
        timeZone: { type: string, description: Only on /v1/today. }
    MonthGrid:
      type: object
      additionalProperties: false
      required: [basis, year, month, monthName, daysInMonth, weekStart, yearStatus, dataVersion, cells, events]
      properties:
        basis: { type: string, enum: [AD, BS] }
        year: { type: integer }
        month: { type: integer }
        monthName: { $ref: '#/components/schemas/Localized' }
        daysInMonth: { type: integer }
        weekStart: { type: integer }
        yearStatus:
          nullable: true
          type: string
          enum: [verified, projected]
          description: Only for BS grids.
        dataVersion: { type: integer, format: int64 }
        cells:
          type: array
          minItems: 42
          maxItems: 42
          items:
            type: object
            additionalProperties: false
            required: [ad, bs, day, weekday, inMonth, isToday, isWeekend, isHoliday, eventIds]
            properties:
              ad: { type: string, format: date }
              bs: { type: string, nullable: true, pattern: '^\d{4}-\d{2}-\d{2}$' }
              day: { type: integer, description: Day number in the grid's basis calendar. }
              weekday: { type: integer }
              inMonth: { type: boolean }
              isToday: { type: boolean, description: Today in Nepal. }
              isWeekend: { type: boolean }
              isHoliday: { type: boolean }
              eventIds: { type: array, items: { type: string } }
        events: { type: array, items: { $ref: '#/components/schemas/Occurrence' } }
    EventRange:
      type: object
      additionalProperties: false
      required: [basis, from, to, count, events]
      properties:
        basis: { type: string, enum: [AD, BS] }
        from: { type: string }
        to: { type: string }
        count: { type: integer }
        events: { type: array, items: { $ref: '#/components/schemas/Occurrence' } }
    TelemetryBatch:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [type]
            properties:
              type: { type: string, enum: [table_rejected, config_applied, config_field_fallback, sync_failed, out_of_range, update_required] }
              app: { type: string }
              clientVersion: { type: string }
              dataVersion: { type: integer, format: int64 }
              configVersion: { type: integer }
              detail: { type: string, maxLength: 500 }

    # ------------------------------------------------------------ admin: auth and users
    TokenPair:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn, refreshToken, refreshExpiresAt, user]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, description: Seconds until the access token expires. }
        refreshToken: { type: string }
        refreshExpiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/AdminUser' }
    Role:
      type: string
      enum: [viewer, editor, designer, calendar_admin, super_admin]
    AdminUser:
      type: object
      additionalProperties: false
      required: [id, email, role, disabled, lastLoginAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        disabled: { type: boolean }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    Me:
      type: object
      additionalProperties: false
      required: [id, email, role, permissions]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        permissions:
          type: array
          items:
            type: string
            enum: [read, 'events:write', 'categories:write', 'years:propose', 'years:approve', 'config:draft', 'config:publish', 'platform:manage']
    UserInput:
      type: object
      additionalProperties: false
      required: [email, role, password]
      properties:
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        password: { type: string, minLength: 12, maxLength: 72 }
    UserPatch:
      type: object
      additionalProperties: false
      properties:
        role: { $ref: '#/components/schemas/Role' }
        disabled: { type: boolean }
        password: { type: string, minLength: 12, maxLength: 72 }

    # ------------------------------------------------------------ admin: categories and events
    CategoryInput:
      type: object
      additionalProperties: false
      required: [key, name, colorLight, colorDark]
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9_]{1,40}$', example: public_holiday }
        name: { $ref: '#/components/schemas/Text' }
        colorLight: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', example: '#B91C1C' }
        colorDark: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', example: '#F87171' }
        isHoliday: { type: boolean, default: false }
        sortOrder: { type: integer, default: 0 }
    CategoryPatch:
      type: object
      additionalProperties: false
      properties:
        name: { $ref: '#/components/schemas/Text' }
        colorLight: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        colorDark: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        isHoliday: { type: boolean }
        sortOrder: { type: integer }
    Category:
      type: object
      additionalProperties: false
      required: [id, key, name, colorLight, colorDark, isHoliday, sortOrder, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name: { $ref: '#/components/schemas/Text' }
        colorLight: { type: string }
        colorDark: { type: string }
        isHoliday: { type: boolean }
        sortOrder: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Recurrence:
      type: string
      enum: [none, yearly_bs, yearly_ad, rrule]
      description: |
        `yearly_bs` (basis BS) repeats on the same BS month and day, clamped to the month length.
        `yearly_ad` (basis AD) repeats on the same AD date; 29 Feb falls on 28 Feb in other years.
        `rrule` (basis AD) is an RFC 5545 rule without DTSTART; FREQ must be DAILY, WEEKLY, MONTHLY or YEARLY.
        Lunar festivals are not rules: enter them per year (see copy-year).
    EventInput:
      type: object
      additionalProperties: false
      required: [category, title, basis, start]
      properties:
        category: { type: string, description: Category key. }
        title: { $ref: '#/components/schemas/Text' }
        description: { $ref: '#/components/schemas/Text' }
        basis: { type: string, enum: [AD, BS], description: Calendar of `start` and `end`. }
        start: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        end: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$', description: Inclusive; defaults to `start`; at most 366 days after it. }
        allDay: { type: boolean, default: true }
        startTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', description: Required when allDay is false. }
        endTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        tz: { type: string, default: Asia/Kathmandu }
        recurrence: { $ref: '#/components/schemas/Recurrence' }
        rrule: { type: string, example: 'FREQ=WEEKLY;BYDAY=FR' }
        recurUntil: { type: string, format: date, description: Last AD date on which an occurrence may start. }
        isHoliday: { type: boolean, description: Overrides the category's holiday flag. }
    EventPatch:
      type: object
      description: JSON Merge Patch of EventInput. `null` clears optional fields.
      additionalProperties: false
      properties:
        category: { type: string }
        title: { $ref: '#/components/schemas/Text' }
        description: { type: object, nullable: true, allOf: [{ $ref: '#/components/schemas/Text' }] }
        basis: { type: string, enum: [AD, BS] }
        start: { type: string }
        end: { type: string }
        allDay: { type: boolean }
        startTime: { type: string, nullable: true }
        endTime: { type: string, nullable: true }
        tz: { type: string }
        recurrence: { $ref: '#/components/schemas/Recurrence' }
        rrule: { type: string, nullable: true }
        recurUntil: { type: string, nullable: true }
        isHoliday: { type: boolean, nullable: true }
    Event:
      type: object
      additionalProperties: false
      required: [id, category, title, description, basis, start, end, ad, bs, allDay, startTime, endTime, tz, recurrence,
                 rrule, recurUntil, isHoliday, status, version, createdBy, updatedBy, createdAt, updatedAt, deletedAt]
      properties:
        id: { type: string, format: uuid }
        category: { type: string }
        title: { $ref: '#/components/schemas/Text' }
        description: { type: object, nullable: true, allOf: [{ $ref: '#/components/schemas/Text' }] }
        basis: { type: string, enum: [AD, BS] }
        start: { type: string, description: In the basis calendar. }
        end: { type: string }
        ad:
          type: object
          additionalProperties: false
          required: [start, end]
          description: AD range of the first occurrence.
          properties:
            start: { type: string, format: date }
            end: { type: string, format: date }
        bs:
          type: object
          additionalProperties: false
          required: [start, end]
          description: BS range of the first occurrence.
          properties:
            start: { $ref: '#/components/schemas/BSDate' }
            end: { $ref: '#/components/schemas/BSDate' }
        allDay: { type: boolean }
        startTime: { type: string, nullable: true }
        endTime: { type: string, nullable: true }
        tz: { type: string }
        recurrence: { $ref: '#/components/schemas/Recurrence' }
        rrule: { type: string, nullable: true }
        recurUntil: { type: string, format: date, nullable: true }
        isHoliday: { type: boolean, nullable: true, description: Null inherits from the category. }
        status: { type: string, enum: [draft, published, archived] }
        version: { type: integer, description: Send as If-Match. }
        createdBy: { type: string, format: uuid }
        updatedBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time, nullable: true }
    EventPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Event' } }
        nextCursor: { type: string, nullable: true }
    ImportReport:
      type: object
      additionalProperties: false
      required: [dryRun, total, valid, invalid, duplicates, created, rows]
      properties:
        dryRun: { type: boolean }
        total: { type: integer }
        valid: { type: integer }
        invalid: { type: integer }
        duplicates: { type: integer }
        created: { type: integer }
        rows:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [row, title, start, errors, duplicate]
            properties:
              row: { type: integer, description: CSV line number (the header is line 1). }
              title: { type: string }
              start: { type: string }
              errors:
                type: array
                nullable: true
                items: { $ref: '#/components/schemas/FieldError' }
              duplicate: { type: boolean }
    CopyYearInput:
      type: object
      additionalProperties: false
      required: [fromBsYear, toBsYear]
      properties:
        fromBsYear: { type: integer, example: 2083 }
        toBsYear: { type: integer, example: 2084 }
        categories: { type: array, items: { type: string }, description: Limit to these category keys. }
    CopyYearReport:
      type: object
      additionalProperties: false
      required: [created, skipped]
      properties:
        created: { type: array, items: { type: string, format: uuid } }
        skipped: { type: array, items: { $ref: '#/components/schemas/EventShift' } }
    EventShift:
      type: object
      additionalProperties: false
      required: [eventId, title, basis, start, oldAdStart]
      properties:
        eventId: { type: string, format: uuid }
        title: { type: string }
        basis: { type: string }
        start: { type: string }
        oldAdStart: { type: string }
        newAdStart: { type: string }
        problem: { type: string }

    # ------------------------------------------------------------ admin: year table
    YearView:
      type: object
      additionalProperties: false
      required: [bsYear, adStart, adEnd, days, length, status, source]
      properties:
        bsYear: { type: integer }
        adStart: { type: string, format: date }
        adEnd: { type: string, format: date }
        days: { type: array, minItems: 12, maxItems: 12, items: { type: integer } }
        length: { type: integer }
        status: { $ref: '#/components/schemas/YearStatus' }
        source: { type: string }
    YearList:
      type: object
      additionalProperties: false
      required: [dataVersion, sha256, items]
      properties:
        dataVersion: { type: integer, format: int64 }
        sha256: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/YearView' } }
    YearChange:
      type: object
      additionalProperties: false
      required: [bsYear, days, status, source]
      properties:
        bsYear: { type: integer }
        days: { type: array, minItems: 12, maxItems: 12, items: { type: integer, minimum: 29, maximum: 32 } }
        status: { $ref: '#/components/schemas/YearStatus' }
        source: { type: string, minLength: 1, maxLength: 500, description: Where the numbers come from. }
        adStart: { type: string, format: date, description: "Only to move a year's start, or to add a year before the first." }
    YearDraftInput:
      type: object
      additionalProperties: false
      required: [changes]
      properties:
        changes: { type: array, minItems: 1, maxItems: 50, items: { $ref: '#/components/schemas/YearChange' } }
        note: { type: string }
    Issue:
      type: object
      additionalProperties: false
      required: [severity, message]
      properties:
        year: { type: integer }
        severity: { type: string, enum: [error, warning] }
        message: { type: string }
    YearDraft:
      type: object
      additionalProperties: false
      required: [id, state, baseVersion, changes, note, warnings, impact, reason, createdBy, decidedBy, createdAt, decidedAt]
      properties:
        id: { type: string, format: uuid }
        state: { type: string, enum: [pending, approved, rejected] }
        baseVersion: { type: integer, format: int64 }
        changes: { type: array, items: { $ref: '#/components/schemas/YearChange' } }
        note: { type: string }
        warnings: { type: array, items: { $ref: '#/components/schemas/Issue' } }
        impact:
          type: object
          additionalProperties: false
          required: [years, movedEvents, invalidEvents, eventsTruncated]
          properties:
            years:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [bsYear, before, after]
                properties:
                  bsYear: { type: integer }
                  before: { type: object, nullable: true, allOf: [{ $ref: '#/components/schemas/YearView' }] }
                  after: { $ref: '#/components/schemas/YearView' }
            movedEvents: { type: array, items: { $ref: '#/components/schemas/EventShift' } }
            invalidEvents: { type: array, items: { $ref: '#/components/schemas/EventShift' } }
            eventsTruncated: { type: boolean }
        reason: { type: string, nullable: true }
        createdBy: { type: string, format: uuid }
        decidedBy: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time, nullable: true }
    ReasonInput:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000 }

    # ------------------------------------------------------------ admin: UI config
    Finding:
      type: object
      additionalProperties: false
      required: [path, message]
      properties:
        path: { type: string, example: /theme/dark/text }
        message: { type: string }
    ValidationReport:
      type: object
      additionalProperties: false
      required: [valid, errors, warnings]
      properties:
        valid: { type: boolean }
        errors: { type: array, items: { $ref: '#/components/schemas/Finding' } }
        warnings: { type: array, items: { $ref: '#/components/schemas/Finding' } }
    UiConfigInput:
      type: object
      additionalProperties: false
      required: [config]
      properties:
        config: { $ref: '#/components/schemas/UiConfigDocument' }
        minClientVersion: { type: string, pattern: '^\d+\.\d+\.\d+$', default: 0.0.0, description: Older apps keep an earlier compatible version. }
        note: { type: string, maxLength: 1000 }
    UiConfigVersion:
      type: object
      additionalProperties: false
      required: [app, version, status, origin, schemaVersion, minClientVersion, note, rejectReason, config, createdBy,
                 approvedBy, createdAt, updatedAt, publishedAt]
      properties:
        app: { type: string }
        version: { type: integer }
        status: { type: string, enum: [draft, in_review, published, superseded, rolled_back, rejected], description: '`rolled_back` versions were replaced by an emergency rollback and are never offered to older apps.' }
        origin: { type: string, enum: [draft, rollback] }
        schemaVersion: { type: integer }
        minClientVersion: { type: string }
        note: { type: string, nullable: true }
        rejectReason: { type: string, nullable: true }
        config: { $ref: '#/components/schemas/UiConfigDocument' }
        createdBy: { type: string, format: uuid }
        approvedBy: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        publishedAt: { type: string, format: date-time, nullable: true }
        validation: { $ref: '#/components/schemas/ValidationReport' }
    UiConfigChannel:
      type: object
      additionalProperties: false
      required: [app, stableVersion, candidateVersion, candidatePercent, updatedAt]
      properties:
        app: { type: string }
        stableVersion: { type: integer, description: 0 means the built-in default. }
        candidateVersion: { type: integer, nullable: true }
        candidatePercent: { type: integer }
        updatedAt: { type: string, format: date-time }
    UiConfigList:
      type: object
      additionalProperties: false
      required: [channel, items]
      properties:
        channel: { $ref: '#/components/schemas/UiConfigChannel' }
        items: { type: array, items: { $ref: '#/components/schemas/UiConfigVersion' } }

    # ------------------------------------------------------------ admin: platform
    ApiClientInput:
      type: object
      additionalProperties: false
      required: [name, kind]
      properties:
        name: { type: string, maxLength: 100, example: Marketing website }
        kind: { type: string, enum: [public, server] }
        allowedOrigins: { type: array, items: { type: string }, example: ['https://www.example.com'] }
        ratePerMin: { type: integer, minimum: 1, maximum: 1000000, description: 'Default 600 (public) or 6000 (server).' }
    ApiClient:
      type: object
      additionalProperties: false
      required: [id, name, kind, keyPrefix, allowedOrigins, ratePerMin, revoked, lastUsedAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [public, server] }
        keyPrefix: { type: string }
        allowedOrigins: { type: array, items: { type: string } }
        ratePerMin: { type: integer }
        revoked: { type: boolean }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    ApiClientCreated:
      type: object
      additionalProperties: false
      required: [id, name, kind, keyPrefix, allowedOrigins, ratePerMin, revoked, lastUsedAt, createdAt, key]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [public, server] }
        keyPrefix: { type: string }
        allowedOrigins: { type: array, items: { type: string } }
        ratePerMin: { type: integer }
        revoked: { type: boolean }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        key: { type: string, description: The full key. Shown once. }
    WebhookInput:
      type: object
      additionalProperties: false
      required: [url, topics]
      properties:
        url: { type: string, format: uri, description: 'https required unless ALLOW_PRIVATE_WEBHOOKS (development).' }
        topics:
          type: array
          minItems: 1
          items: { type: string, enum: [events, categories, config, data] }
    Webhook:
      type: object
      additionalProperties: false
      required: [id, url, topics, active, createdAt]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        topics: { type: array, items: { type: string } }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
    WebhookCreated:
      type: object
      additionalProperties: false
      required: [id, url, topics, active, createdAt, secret]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        topics: { type: array, items: { type: string } }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        secret: { type: string, description: HMAC signing secret (whsec_…). Shown once. }
    WebhookEvent:
      type: object
      description: Body POSTed to webhook receivers.
      required: [id, type, topic, at]
      properties:
        id: { type: string, example: evt_3f2a… }
        type: { type: string, enum: [events.changed, categories.changed, config.changed, data.published] }
        topic: { type: string, enum: [events, categories, config, data] }
        tenantId: { type: string }
        at: { type: string, format: date-time }
        data: { type: object, additionalProperties: true }
    WebhookDelivery:
      type: object
      additionalProperties: false
      required: [id, eventType, attempts, state, lastError, nextRunAt, doneAt, createdAt]
      properties:
        id: { type: integer, format: int64 }
        eventType: { type: string }
        attempts: { type: integer }
        state: { type: string, enum: [pending, delivered, dead] }
        lastError: { type: string, nullable: true }
        nextRunAt: { type: string, format: date-time }
        doneAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    AuditEntry:
      type: object
      additionalProperties: false
      required: [id, at, actorId, actorEmail, actorIp, action, entity, entityId, before, after, requestId]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        actorId: { type: string, nullable: true }
        actorEmail: { type: string, nullable: true }
        actorIp: { type: string, nullable: true }
        action: { type: string, example: event.publish }
        entity: { type: string, example: event }
        entityId: { type: string }
        before: { type: object, nullable: true, additionalProperties: true, description: Snapshot before the change. }
        after: { type: object, nullable: true, additionalProperties: true, description: Snapshot after the change. }
        requestId: { type: string, nullable: true }
    AuditPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
        nextCursor: { type: string, nullable: true }
    DataHealth:
      type: object
      additionalProperties: false
      required: [dataVersion, supportedRange, currentBsYear, firstProjectedBsYear, daysUntilProjected, nextYear, outbox]
      properties:
        dataVersion: { type: integer, format: int64 }
        supportedRange: { $ref: '#/components/schemas/SupportedRange' }
        currentBsYear: { type: integer }
        firstProjectedBsYear: { type: integer, nullable: true }
        daysUntilProjected: { type: integer, nullable: true, description: Alert when this drops below 90. }
        nextYear:
          type: object
          additionalProperties: false
          required: [bsYear]
          properties:
            bsYear: { type: integer }
            startsOn: { type: string, format: date }
            startsInDays: { type: integer }
            status: { $ref: '#/components/schemas/YearStatus' }
            publishedHolidays: { type: integer, description: Alert when 0 within 60 days of the new year. }
        outbox:
          type: object
          additionalProperties: false
          required: [pending, dead, oldestPendingAgeSeconds]
          properties:
            pending: { type: integer }
            dead: { type: integer }
            oldestPendingAgeSeconds: { type: number }
