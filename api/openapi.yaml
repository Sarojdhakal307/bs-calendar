      description: Lunar festivals move every year, so review each draft before publishing. Safe to run twice.
      operationId: copyYear
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CopyYearInput' }
      responses:
        '201':
          description: Report.
